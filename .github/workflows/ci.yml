name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm -r run test
      - run: pnpm run accept:p0
      - run: pnpm run accept:p1
      - run: pnpm run accept:p2
      - run: pnpm run accept:dsh-admin
      - run: pnpm run eval:recall
      - run: pnpm run lint
        continue-on-error: true
